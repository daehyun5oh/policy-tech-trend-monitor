<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기술키워드 동향 모니터 (샘플 데모)</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f9f9f7; --panel: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --faint: #898781; --rule: #e1e0d9; --axis: #c3c2b7;
  --news: #2a78d6; --policy: #eb6834; --all: #2a78d6; --cur: #2a78d6; --base: #898781; --focus: #2a78d6;
  --alert: #a3362b; --alert-bg: #f7e4e0; --partial-bg: #efe8d3; --track: #eceae3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0d0d; --panel: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --faint: #898781; --rule: #2c2c2a; --axis: #383835;
    --news: #3987e5; --policy: #d95926; --all: #3987e5; --cur: #3987e5; --base: #898781; --focus: #3987e5;
    --alert: #f0847a; --alert-bg: #3a2320; --partial-bg: #332e1c; --track: #262624;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0d0d; --panel: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --faint: #898781; --rule: #2c2c2a; --axis: #383835;
  --news: #3987e5; --policy: #d95926; --all: #3987e5; --cur: #3987e5; --base: #898781; --focus: #3987e5;
  --alert: #f0847a; --alert-bg: #3a2320; --partial-bg: #332e1c; --track: #262624;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.65 "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all; overflow-wrap: break-word;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.masthead { max-width: 1240px; margin: 0 auto; padding: 24px 24px 4px; }
.masthead h1 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.015em; }
.masthead p { margin: 0; max-width: 70ch; color: var(--muted); }
.notice { margin: 0; padding: 8px 24px; text-align: center; font-size: 0.9rem; color: var(--ink); background: var(--partial-bg); border-bottom: 1px solid var(--rule); }
.filters { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.filters .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; max-width: 1240px; margin: 0 auto; padding: 10px 24px; }
.filters fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
.filters legend, .filters label { display: block; padding: 0; margin: 0 0 3px; font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { padding: 6px 14px; background: var(--panel); border: 0; border-right: 1px solid var(--rule); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.seg button:disabled { opacity: 0.4; cursor: default; }
.filters select { padding: 6px 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.coverage { max-width: 1240px; margin: 0 auto; padding: 0 24px 8px; font-size: 0.8rem; color: var(--faint); }
.covline { margin-right: 14px; }
.nw { white-space: nowrap; }
main { max-width: 1240px; margin: 0 auto; padding: 8px 24px 64px; min-width: 0; }
main h2 { margin: 0 0 4px; font-size: 1.2rem; letter-spacing: -0.01em; }
main h3 { margin: 18px 0 6px; font-size: 0.98rem; }
.sum { margin: 0 0 10px; color: var(--muted); }
.note { margin: 8px 0; padding: 8px 12px; border-left: 4px solid var(--faint); background: var(--panel); font-size: 0.92rem; }
.note.partial { border-left: 4px dashed var(--policy); background: var(--partial-bg); }
.note.alert { border-left-color: var(--alert); background: var(--alert-bg); }
.note.scope summary { cursor: pointer; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
.card { grid-column: span 12; min-width: 0; padding: 16px 18px 18px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.card.s7 { grid-column: span 7; } .card.s5 { grid-column: span 5; } .card.s6 { grid-column: span 6; }
.card h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 1.02rem; }
.card h3 { margin: 14px 0 4px; font-size: 0.9rem; color: var(--muted); }
.card .ranks { margin-top: 6px; }
.help { position: relative; display: inline-block; }
.help summary { list-style: none; cursor: pointer; width: 20px; height: 20px; line-height: 18px; text-align: center; font-size: 0.74rem; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); }
.help summary::-webkit-details-marker { display: none; }
.help .pop { position: absolute; z-index: 6; top: 26px; left: 0; width: min(340px, 80vw); padding: 10px 12px; font-size: 0.84rem; font-weight: 400; line-height: 1.5; color: var(--ink); background: var(--panel); border: 1px solid var(--axis); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12); }
.notes { margin: 8px 0 0; }
.notes > summary { cursor: pointer; font-size: 0.86rem; color: var(--muted); }
.chip-note { display: inline-block; margin: 4px 6px 0 0; padding: 2px 10px; font-size: 0.82rem; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.chip-note.alert { border-color: var(--alert); background: var(--alert-bg); }
.chip-note.partial { border-style: dashed; border-color: var(--policy); background: var(--partial-bg); }
.stack { display: flex; height: 18px; margin: 8px 0 4px; gap: 2px; }
.stack span { display: block; min-width: 3px; }
.stack .n { background: var(--news); border-radius: 4px 0 0 4px; } .stack .p { background: var(--policy); border-radius: 0 4px 4px 0; }
.srcbars { margin: 6px 0 0; padding: 0; list-style: none; }
.srcbars li { display: grid; grid-template-columns: minmax(6rem, 11rem) minmax(0, 1fr) 3.2rem; align-items: center; gap: 10px; padding: 4px 0; font-size: 0.9rem; }
.srcbars .sb { height: 12px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--bar, var(--all)); }
.srcbars .sv { text-align: right; color: var(--muted); font-size: 0.84rem; }
.srcbars li.ty-news { --bar: var(--news); } .srcbars li.ty-policy { --bar: var(--policy); }
.ccols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.ccol { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.ccol h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 6px; font-size: 0.98rem; color: var(--ink); }
.ccol h3 small { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.ccol ul { margin: 0; padding: 0; list-style: none; }
.ccol li { display: grid; grid-template-columns: minmax(5rem, 8.5rem) minmax(0, 1fr) 2.6rem; align-items: center; gap: 8px; padding: 3px 0; font-size: 0.88rem; }
.ccol .cb { height: 10px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--policy); }
.ccol .cv { text-align: right; color: var(--muted); font-size: 0.82rem; }
.ccol .none { color: var(--muted); font-size: 0.86rem; }
.docrow { display: grid; grid-template-columns: 5.2rem 3.2rem minmax(0, 1fr); gap: 4px 12px; padding: 8px 2px; border-bottom: 1px solid var(--rule); font-size: 0.9rem; }
.docrow .dd { color: var(--muted); font-size: 0.82rem; }
.docrow .dsrc { grid-column: 3; color: var(--muted); font-size: 0.8rem; }
.docrow .dtt a { color: var(--ink); text-decoration-color: var(--policy); text-underline-offset: 3px; }
.docrow .dkw { grid-column: 3; display: flex; flex-wrap: wrap; gap: 4px; }
.docrow .dkw span { padding: 0 8px; font-size: 0.76rem; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); }
.flag { display: inline-block; padding: 0 6px; font-size: 0.74rem; border: 1px solid var(--rule); border-radius: 8px; color: var(--muted); }
.morebtn { margin: 10px 0 0; padding: 5px 14px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; }
@media (max-width: 900px) { .card.s7, .card.s5, .card.s6 { grid-column: span 12; } .docrow { grid-template-columns: 4.6rem 1fr; } .docrow .dsrc, .docrow .dkw { grid-column: 1 / -1; } }
.fine { margin: 10px 0 0; font-size: 0.84rem; color: var(--muted); max-width: 72ch; }
.guide { margin: 14px 0 0; padding: 12px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.guide h2 { font-size: 1rem; }
.guide dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 0.9rem; }
.guide dt { font-weight: 700; } .guide dd { margin: 0; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 14px 0; }
.tile { padding: 12px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.tile .lab { font-size: 0.82rem; color: var(--muted); }
.tile .big { font-size: 2.2rem; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
.tile .big.txt { font-size: 1.4rem; }
.tile .sub { font-size: 0.82rem; color: var(--muted); }
.headline { margin: 8px 0 0; font-size: 1.02rem; max-width: 76ch; }
.headline b { font-weight: 700; }
/* 순위 */
.ranks { margin: 12px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.ranks:empty { display: none; }
.rowbtn { display: grid; grid-template-columns: 2.6rem minmax(7rem, 12rem) minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; padding: 7px 4px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.rowbtn:hover { background: var(--panel); }
.rowbtn[aria-expanded="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--bar, var(--all)); }
.rk { font-weight: 700; }
.rk .tie { display: block; font-size: 0.7rem; font-weight: 400; color: var(--muted); line-height: 1.1; }
.kw { font-weight: 600; }
.meter { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar { flex: none; height: 14px; min-width: 3px; border-radius: 0 4px 4px 0; background: var(--bar, var(--all)); }
.val { font-size: 0.84rem; color: var(--muted); white-space: nowrap; }
.t-news { --bar: var(--news); } .t-policy { --bar: var(--policy); } .t-all { --bar: var(--all); }
.evidence { padding: 8px 4px 16px calc(2.6rem + 16px); border-bottom: 1px solid var(--rule); background: var(--panel); }
.docs { margin: 0; padding: 0; list-style: none; }
.docs li { padding: 5px 0; }
.docs a { color: var(--ink); text-decoration-color: var(--bar, var(--all)); text-underline-offset: 3px; }
.docs .m { margin-left: 12px; font-size: 0.82rem; color: var(--muted); }
.kwhead { margin: 0 0 4px; font-size: 0.93rem; max-width: 70ch; }
.kwhead .cat { display: inline-block; margin-right: 8px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 10px; font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; padding: 0; list-style: none; }
.chips li { padding: 1px 9px; border: 1px solid var(--rule); border-radius: 10px; font-size: 0.82rem; background: var(--paper); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
.tabs button { padding: 4px 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; font-size: 0.88rem; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.pairs { margin: 0; padding: 0; list-style: none; }
.pairs li { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; }
.pairs .n { font-size: 0.82rem; color: var(--muted); }
.pairs .bar2 { flex: none; height: 10px; min-width: 3px; background: var(--bar, var(--all)); }
/* 평소와 비교: 덤벨 */
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 6px 0 4px; font-size: 0.84rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.b { background: var(--base); } .legend i.c { background: var(--cur); }
.legend i.n { background: var(--news); } .legend i.p { background: var(--policy); border-radius: 2px; } .legend i.n { border-radius: 2px; }
.dumb { margin: 0; padding: 0; list-style: none; }
.drow { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(120px, 1fr) minmax(8rem, 15rem); align-items: center; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.dname { font-weight: 600; }
.dtrack { position: relative; height: 24px; margin: 0 8px; background: linear-gradient(var(--rule), var(--rule)) center / 100% 1px no-repeat; }
.dlink { position: absolute; top: 11px; height: 2px; background: var(--axis); }
.dot { position: absolute; top: 4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 2px solid var(--paper); }
.dot.b { background: var(--base); } .dot.c { background: var(--cur); }
.dtext { font-size: 0.88rem; line-height: 1.35; }
.dtext .dsub { display: block; font-size: 0.78rem; color: var(--muted); }
.badge { display: inline-block; margin-left: 6px; padding: 0 7px; font-size: 0.72rem; font-weight: 600; border-radius: 9px; border: 1px solid var(--ink); }
.badge.weak { font-weight: 400; color: var(--muted); border-color: var(--rule); }
.tag { margin-left: 6px; padding: 0 6px; font-size: 0.72rem; font-weight: 400; border: 1px solid var(--rule); border-radius: 8px; color: var(--muted); white-space: nowrap; }
.axisrow { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(120px, 1fr) minmax(8rem, 15rem); gap: 14px; font-size: 0.74rem; color: var(--faint); }
.axisrow .ax { display: flex; justify-content: space-between; margin: 0 8px; }
/* 뉴스 vs 정책: 나비 */
.fly { margin: 0; padding: 0; list-style: none; }
.frow { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) minmax(7rem, 11rem) minmax(0, 1fr) 3.4rem; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.frow .fl { display: flex; justify-content: flex-end; } .frow .fr { display: flex; justify-content: flex-start; }
.fbar { height: 14px; min-width: 2px; }
.fbar.n { background: var(--news); border-radius: 4px 0 0 4px; } .fbar.p { background: var(--policy); border-radius: 0 4px 4px 0; }
.fval { font-size: 0.8rem; color: var(--muted); }
.fval.l { text-align: right; }
.fname { text-align: center; font-weight: 600; font-size: 0.93rem; }
.fname .tag { display: inline-block; }
.fhead { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) minmax(7rem, 11rem) minmax(0, 1fr) 3.4rem; gap: 8px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.fhead .l { grid-column: 1 / 3; text-align: right; } .fhead .r { grid-column: 4 / 6; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.chipbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.chipbar button { padding: 4px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; cursor: pointer; font-size: 0.88rem; }
.chipbar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.chipbar small { color: var(--muted); margin-left: 4px; }
.spark { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; padding: 0; list-style: none; }
.spark li { padding: 8px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.spark .sk { font-weight: 600; font-size: 0.92rem; }
.spark .sv { font-size: 0.8rem; color: var(--muted); }
.spark svg { display: block; width: 100%; height: 34px; margin-top: 4px; overflow: visible; }
.spark polyline { fill: none; stroke: var(--bar, var(--all)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--bar, var(--all)); stroke: var(--panel); stroke-width: 2; }
details.twin { margin: 12px 0 0; }
details.twin summary { cursor: pointer; font-size: 0.86rem; color: var(--muted); }
.scroll { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; min-width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); }
th:first-child, td:first-child { text-align: left; background: var(--paper); color: var(--ink); font-weight: 600; }
td.cell { background: color-mix(in srgb, var(--bar, var(--all)) calc(var(--i, 0) * 62%), transparent); }
.cur { box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); }
th small { display: block; font-weight: 400; font-size: 0.72rem; }
.dpos { font-weight: 700; } .dneg { font-weight: 700; color: var(--muted); }
@media (max-width: 760px) {
  .masthead, main, .coverage, .filters .row { padding-left: 16px; padding-right: 16px; }
  .drow { grid-template-columns: 1fr; gap: 2px; }
  .axisrow { display: none; }
  .frow, .fhead { grid-template-columns: 2.8rem minmax(0, 1fr) minmax(5rem, 7rem) minmax(0, 1fr) 2.8rem; }
  .rowbtn { grid-template-columns: 2.4rem 1fr; }
  .rowbtn .meter { grid-column: 2; }
  .evidence { padding-left: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .bar { transition: width 0.2s ease-out; } }
</style>
</head>
<body>
<header class="masthead">
  <h1>기술키워드 동향 모니터 (샘플 데모)</h1>
  <p>수집한 뉴스·정책 자료에서 기술키워드가 언급된 문서를 세어, 무엇이 많이 언급됐는지와 평소와 무엇이 달라졌는지를 한 화면에 보여 줍니다. 언급량일 뿐 기술의 중요도나 전망을 뜻하지 않습니다.</p>
</header>
<p class="notice" id="notice" hidden></p>
<div class="filters" role="search" aria-label="조회 조건">
  <div class="row">
    <fieldset><legend>기간 단위</legend><div class="seg" id="ptSeg"></div></fieldset>
    <div><label for="periodSel">기간</label><select id="periodSel"></select></div>
    <fieldset><legend>자료 유형</legend><div class="seg" id="typeSeg"></div></fieldset>
    <div><label for="topSel">순위에 보일 키워드</label><select id="topSel"></select></div>
  </div>
</div>
<p class="coverage" id="coverage"></p>
<main id="main">
  <section id="status" aria-live="polite"></section>
  <div class="grid">
    <section class="card" id="secOverview" aria-labelledby="ovHead">
      <h2 id="ovHead">한눈에 보기</h2>
      <div id="ovBox"></div>
    </section>
    <section class="card s7" id="secRank" aria-labelledby="rankHead">
      <h2 id="rankHead">많이 언급된 키워드</h2>
      <p class="sum" id="rankSum"></p>
      <ol class="ranks" id="rankList"></ol>
      <p class="fine" id="rankMsg"></p>
    </section>
    <section class="card s5" id="secSide" aria-labelledby="sideHead">
      <h2 id="sideHead">자료 구성</h2>
      <div id="sideBox"></div>
    </section>
    <section class="card" id="secCountry" aria-labelledby="ctryHead">
      <h2 id="ctryHead">정책: 국가별 키워드</h2>
      <div id="ctryBox"></div>
    </section>
    <section class="card" id="secDocs" aria-labelledby="docsHead">
      <h2 id="docsHead">정책 문서</h2>
      <div id="docsBox"></div>
    </section>
    <section class="card s6" id="secChange" aria-labelledby="chgHead">
      <h2 id="chgHead">평소와 달라진 키워드</h2>
      <div id="chgBox"></div>
    </section>
    <section class="card s6" id="secTrend" aria-labelledby="trendHead">
      <h2 id="trendHead">흐름</h2>
      <p class="sum" id="trendSum"></p>
      <div id="trendBox"></div>
    </section>
    <section class="card" id="secGap" aria-labelledby="gapHead">
      <h2 id="gapHead">뉴스와 정책은 어떻게 다른가</h2>
      <div id="gapBox"></div>
    </section>
    <section class="card" id="secCat" aria-labelledby="catHead">
      <h2 id="catHead">분야 안에서 보기</h2>
      <div id="catBox"></div>
    </section>

  // 기본으로 보여 줄 기간: 가장 최근 기간. 일간은 자료가 있는 가장 최근 날(오늘 자료가 없을 때 빈 화면을 피함).
  function defaultPeriod(pt) {
    var l = plist(pt);
    if (!l.length) return '';
    if (pt === 'daily') {
      for (var i = l.length - 1; i >= 0; i--) {
        var v = M.views[vkey('daily', l[i].start, 'all')];
        if (v && v.analyzed > 0) return l[i].start;
      }
    }
    return l[l.length - 1].start;
  }
  function readHash() {
    var q = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      try { q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* 잘못된 값은 무시 */ }
    });
    var s = { pt: firstUnit(), type: 'all', n: 10, open: q.open || '', cat: q.c || '' };
    if (q.pt && plist(q.pt).length) s.pt = q.pt;
    s.period = defaultPeriod(s.pt);
    if (q.p && findPeriod(s.pt, q.p)) s.period = q.p;
    if (q.t && TYPE_LABEL[q.t]) s.type = q.t;
    if (q.n && TOPS.indexOf(parseInt(q.n, 10)) >= 0) s.n = parseInt(q.n, 10);
    return s;
  }
  function sync() {
    var h = '#pt=' + state.pt + '&p=' + state.period + '&t=' + state.type + '&n=' + state.n;
    if (state.open) h += '&open=' + encodeURIComponent(state.open);
    if (state.cat) h += '&c=' + encodeURIComponent(state.cat);
    try { history.replaceState(null, '', h); } catch (e) { /* file:// 등에서 막히면 주소 갱신만 생략 */ }
  }

  function renderControls() {
    var ptBox = $('ptSeg'); clear(ptBox);

        state.pt = o.id; state.period = defaultPeriod(o.id); state.open = '';

    var sel = $('periodSel'); clear(sel);
    plist(state.pt).slice().reverse().forEach(function (p) {

    var tyBox = $('typeSeg'); clear(tyBox);
    M.types.forEach(function (t) {

    var cov = $('coverage'); clear(cov);
    Object.keys(M.coverage || {}).forEach(function (k) {

    });
    if (M.latestCollected) {

    } else {

  // 제목 옆의 ? 를 누르면 설명이 나온다(긴 안내문을 화면에서 걷어내려는 용도).

  function renderStatus() {
    var box = $('status'); clear(box);
    var p = findPeriod(state.pt, state.period), v = M.views[vkey(state.pt, state.period, state.type)];
    var label = TYPE_LABEL[state.type];
    var heading;
    if (state.pt === 'range') {
      var days = Math.round((new Date(p.end + 'T00:00:00') - new Date(p.start + 'T00:00:00')) / 86400000) + 1;
      heading = '조회 기간 ' + p.start + ' ~ ' + p.end + ' (' + days + '일)';
    } else {
      heading = p.start === p.end ? p.start + ' (' + DOW[new Date(p.start + 'T00:00:00').getDay()] + ')' : p.start + ' ~ ' + p.end;
    }
    box.appendChild(el('h2', null, heading));
    box.appendChild(el('p', 'sum', label + ' 자료에서 분석한 문서는 ' + v.analyzed + '건이고, 제외한 문서는 ' + v.excluded + '건입니다.'));
    var notes = [];
    function note(text, cls) { notes.push({ text: text, cls: cls || '' }); }
    if (state.pt === 'daily') {
      var today = todayKst(), lastDay = defaultPeriod('daily');
      if (state.period === today) note('오늘의 키워드입니다.');
      else if (state.period === lastDay && today > lastDay) note('오늘(' + today + ') 분석한 문서가 없어 자료가 있는 가장 최근 날짜(' + lastDay + ')를 보여 줍니다.');
    }
    if (p.partial) note('부분 기간 — 수집 종료일(' + M.latestCollected + ')이 이 기간 안에 있거나 기간이 그 뒤까지 이어져, 이후 수집분이 들어오면 수치가 바뀝니다.', 'partial');
    if (v.csvTotal !== null && v.csvTotal !== v.analyzed) {
      note('keyword_stats.csv의 total_documents(' + v.csvTotal + ')와 documents.csv의 분석 문서 수(' + v.analyzed + ')가 다릅니다. 두 파일을 같은 실행 결과로 다시 만드세요.', 'alert');
    }
    if (state.type === 'all') {
      ['news', 'policy'].forEach(function (k) {
        var pv = M.views[vkey(state.pt, state.period, k)];
        if (pv && pv.analyzed === 0) note('이 기간에는 ' + TYPE_LABEL[k] + ' 자료가 없어 통합 결과에 반영되지 않았습니다.', 'alert');
      });
      var cr = M.commonRange, cv = M.coverage || {};
      var ks = Object.keys(cv);
      if (ks.length > 1 && (!cr || ks.some(function (k) { return cv[k][0] !== cr[0] || cv[k][1] !== cr[1]; }))) {
        note('뉴스와 정책의 자료 범위가 다릅니다' + (cr ? ' (공통 범위 ' + cr[0] + ' ~ ' + cr[1] + ')' : ' (겹치는 기간 없음)') + '. 공통 범위 밖의 기간은 한쪽 유형만 반영됩니다.');
      }
    }
    var failed = sumOver(M.overall.failed, state.type);
    if (failed > 0) note('수집 또는 분석에 실패한 ' + label + ' 문서 ' + failed + '건은 어느 집계에도 포함되지 않았습니다.', 'alert');
    var undated = sumOver(M.overall.excludedUndated, state.type);
    if (undated > 0) note('발행일을 확인할 수 없어 제외한 ' + label + ' 문서 ' + undated + '건은 어느 집계에도 들어가지 않았습니다.');
    var wrap = el('div');
    notes.filter(function (n) { return n.cls === 'alert' || n.cls === 'partial'; }).forEach(function (n) {
      wrap.appendChild(el('span', 'chip-note ' + n.cls, n.text));
    });
    var rest = notes.filter(function (n) { return !(n.cls === 'alert' || n.cls === 'partial'); });
    var scopeDet = null;
    // 출처마다 분석한 텍스트 범위가 다르면 알린다. 제목만 분석한 문서는 제목에 없는 키워드를 잡을 수 없어,
    // 출처끼리 문서 빈도를 그대로 견주면 불리한 출처가 생긴다.
    if (v.scope && v.scope.length) {
      var kinds = {};
      v.scope.forEach(function (r) { r.slice(1).forEach(function (n, i) { if (n > 0) kinds[i] = true; }); });
      scopeDet = el('div');
      scopeDet.appendChild(el('strong', null, '출처별 분석 범위' + (Object.keys(kinds).length > 1 ? ' — 출처마다 다름' : '')));
      var ul = el('ul', 'chips');
      v.scope.forEach(function (r) {
        var parts = [];
        if (r[1]) parts.push('제목만 ' + r[1]);
        if (r[2]) parts.push('제목+요약 ' + r[2]);
        if (r[3]) parts.push('제목+본문 ' + r[3]);
        ul.appendChild(el('li', null, r[0] + ': ' + parts.join(' · ')));
      });
      scopeDet.appendChild(ul);
      scopeDet.appendChild(el('p', 'fine', '제목만 분석한 문서는 제목에 없는 키워드를 잡을 수 없고, 요약이나 본문이 짧은 출처도 마찬가지입니다. 분석 범위가 다른 출처끼리 문서 빈도를 그대로 견주지 마세요.'));
    }

      rest.forEach(function (n) { det.appendChild(el('p', 'fine', n.text)); });
      if (scopeDet) det.appendChild(scopeDet);
      wrap.appendChild(det);
    }
    box.appendChild(wrap);
  }

  var UNIT_WORD = { range: '일', daily: '일', weekly: '주', monthly: '개월' };

  function docList(v, kid) {

      return el('p', 'fine', '근거 문서를 찾지 못했습니다. documents.csv와 document_keywords.csv가 같은 실행 결과인지 확인하세요.');

  // 막대 하나가 붙은 목록: rows = [[라벨, 값, 보조 설명]]

  function contextBody(tab, v, kid) {

    if (tab === 'docs') { box.appendChild(docList(v, kid)); return box; }
    if (!c) { box.appendChild(el('p', 'fine', '이 기간의 맥락 값을 계산하지 못했습니다.')); return box; }
    if (tab === 'co') {
      if (!c.co.length) {

      } else {

    } else if (tab === 'src') {
      box.appendChild(pairList(c.src.map(function (r) { return [r[0], r[1], r[1] + '건 (그 출처 분석 문서 ' + r[2] + '건 중 ' + r[3] + '%)']; }), c.src[0][1]));
      box.appendChild(el('p', 'fine', '한 출처에 몰려 있는지 보려는 값입니다. 분모는 그 출처의 분석 문서 수입니다.'));
    } else {

  function fillEvidence(panel, v, kid) {

  function renderRanks() {
    var v = M.views[vkey(state.pt, state.period, state.type)];
    var list = $('rankList'), sum = $('rankSum'), msg = $('rankMsg');
    clear(list); sum.textContent = ''; msg.textContent = '';
    var label = TYPE_LABEL[state.type];
    if (v.analyzed === 0) {
      sum.textContent = '이 기간에는 분석한 ' + label + ' 문서가 없습니다. 비율과 순위는 ‘해당 없음’입니다.';

      sum.textContent = '분석한 문서 ' + v.analyzed + '건에서 사전에 등록된 기술키워드가 검출되지 않았습니다.';

    var max = Math.max.apply(null, rows.map(function (r) { return r.dc; }));

    if (rows.length > shown.length && rows[shown.length].rank === shown[shown.length - 1].rank) {
      note += ' 표시 개수 때문에 마지막 순위와 같은 순위의 키워드가 목록 밖에 더 있습니다.';
    }

  function trendTable(unit, kws, curStart, endDate) {
    var all = plist(unit), end = all.length;
    if (endDate) end = all.filter(function (p) { return p.start <= endDate; }).length;
    if (unit === state.pt) {
      for (var i = 0; i < all.length; i++) { if (all[i].start === state.period) { end = i + 1; break; } }
    }
    var periods = all.slice(Math.max(0, end - TREND_WINDOW[unit]), end);
    var table = el('table', 't-' + state.type);
    var cells = {}, max = 1;
    periods.forEach(function (p) {
      var pv = M.views[vkey(unit, p.start, state.type)];
      kws.forEach(function (k) {
        var r = pv && pv.analyzed > 0 ? (pv.map[k.id] || { dc: 0 }) : null;
        cells[p.start + '|' + k.id] = r;
        if (r && r.dc > max) max = r.dc;
      });
    });
    var head = el('tr');
    head.appendChild(el('th', null, '키워드'));
    periods.forEach(function (p) {
      var cur = unit === state.pt && p.start === curStart;
      var th = el('th', cur ? 'cur' : null, unit === 'monthly' ? p.start.slice(0, 7) : p.start.slice(5));
      th.title = plabel(p);
      if (unit === 'weekly') th.appendChild(el('small', null, '~' + p.end.slice(5)));
      if (unit === 'daily') th.appendChild(el('small', null, DOW[new Date(p.start + 'T00:00:00').getDay()]));
      if (p.partial) th.appendChild(el('small', null, '부분'));
      head.appendChild(th);
    });
    var thead = el('thead'); thead.appendChild(head); table.appendChild(thead);
    var tbody = el('tbody');
    kws.forEach(function (k) {
      var tr = el('tr');
      tr.appendChild(el('td', null, k.kw));
      periods.forEach(function (p) {
        var r = cells[p.start + '|' + k.id], pv = M.views[vkey(unit, p.start, state.type)];
        var cur = unit === state.pt && p.start === curStart;
        var td = el('td', 'cell' + (cur ? ' cur' : ''), r ? String(r.dc) : '–');
        if (r) {

  var SVGNS = 'http://www.w3.org/2000/svg';

  /* INSIGHT-BEGIN */

      var sa = codes.reduce(function (x, k) { return x + ((share[k][a] || {}).dc || 0); }, 0), sb = codes.reduce(function (x, k) { return x + ((share[k][b] || {}).dc || 0); }, 0);
      return sb - sa || (seen[a] < seen[b] ? -1 : 1);
    });
    var heads = ['키워드'].concat(codes.map(function (k) { return pv.ctry[k].label + ' (' + pv.ctry[k].N + '건)'; }));
    box.appendChild(twin(makeTable(heads, ids, function (id) {
      var tr = [seen[id]];
      codes.forEach(function (k) { var s = share[k][id]; tr.push(s ? s.dc + '건 (' + parseFloat(s.share).toFixed(0) + '%)' : '–'); });
      return tr;
    })));
    box.appendChild(el('p', 'fine', '‘–’는 그 나라 정책 문서 중 상위 ' + 15 + '개 키워드에 들지 않았다는 뜻입니다. 같은 사건이 여러 기관에 실리면 한 사건이 여러 번 셈될 수 있습니다.'));
  }

  // 정책: 문서 목록(날짜순). 국가 칩으로 거른다. 제한 출처는 제목을 모델에 싣지 않는다.
  function renderDocs() {
    var card = $('secDocs'), box = $('docsBox'); clear(box);
    var pv = M.views[vkey(state.pt, state.period, 'policy')];
    card.hidden = state.type !== 'policy' || !pv || !pv.dl || !pv.dl.length;
    if (card.hidden) return;
    var list = pv.dl.map(function (i) { return M.docs[i]; });
    var codes = [], cnt = {};
    list.forEach(function (d) { var g = d.g || '?'; if (!cnt[g]) { cnt[g] = 0; codes.push(g); } cnt[g]++; });
    if (state.cf && !cnt[state.cf]) state.cf = '';
    var bar = el('div', 'chipbar');
    [['', '전체 (' + list.length + ')']].concat(codes.map(function (g) { return [g, ((M.countryLabels || {})[g] || g) + ' (' + cnt[g] + ')']; })).forEach(function (x) {
      var b = el('button', null, x[1]); b.type = 'button';
      b.setAttribute('aria-pressed', String((state.cf || '') === x[0]));
      b.addEventListener('click', function () { state.cf = x[0]; state.more = false; renderDocs(); });
      bar.appendChild(b);
    });
    box.appendChild(bar);
    var shown = list.filter(function (d) { return !state.cf || (d.g || '?') === state.cf; });
    var limit = state.more ? shown.length : 30;
    shown.slice(0, limit).forEach(function (d) {
      var row = el('div', 'docrow');
      row.appendChild(el('span', 'dd', d.d.slice(5)));
      row.appendChild(el('span', 'flag', (M.countryLabels || {})[d.g] || d.g || '?'));
      var tt = el('div', 'dtt'), text = d.h ? '(제목 비공개 · 원문에서 확인)' : d.t;
      if (isHttp(d.u)) {
        var a = el('a', null, text); a.href = d.u; a.target = '_blank'; a.rel = 'noopener noreferrer'; tt.appendChild(a);
      } else { tt.appendChild(el('span', null, text)); }
      row.appendChild(tt);
      row.appendChild(el('span', 'dsrc', d.s));
      var k = el('div', 'dkw');
      if (d.k && d.k.length) d.k.forEach(function (n) { k.appendChild(el('span', null, n)); });
      else k.appendChild(el('span', null, '사전 키워드 없음'));
      row.appendChild(k);
      box.appendChild(row);
    });
    if (shown.length > limit) {
      var more = el('button', 'morebtn', '나머지 ' + (shown.length - limit) + '건 더 보기'); more.type = 'button';
      more.addEventListener('click', function () { state.more = true; renderDocs(); });
      box.appendChild(more);
    }
    var nokw = list.filter(function (d) { return !d.k || !d.k.length; }).length;
    if (nokw) box.appendChild(el('p', 'note', '이 기간 정책 문서 ' + list.length + '건 중 ' + nokw + '건은 사전에 등록된 키워드가 하나도 나오지 않았습니다. 사전에 없는 용어(예: 양자통신)를 다루는 문서일 수 있어, 이 화면이 비어 보이는 이유가 될 수 있습니다.'));
    box.appendChild(el('p', 'fine', '분석한 정책 문서를 발행일 최신순으로 보여 줍니다(최대 150건). 키워드 칩은 사전에 등록된 표기가 문서에 나왔다는 뜻이며, 주제를 판정하지 않습니다.'));
  }

  function renderChange() {
    var box = $('chgBox'); clear(box);
    var v = M.views[vkey(state.pt, state.period, state.type)], c = v && v.chg, label = TYPE_LABEL[state.type];
    $('secChange').hidden = state.pt === 'range';
    if (state.pt === 'range') return;
    box.appendChild(el('p', 'sum', '같은 키워드가 평소에는 문서의 몇 %에 나오다가, 선택한 기간에는 몇 %에 나왔는지 비교합니다. 어디에나 나오는 키워드(상시)가 아니라 평소와 달라진 부분을 보려는 화면입니다.'));
    if (!c) { box.appendChild(emptyNote('이 기간에는 분석한 ' + label + ' 문서가 없어 비교하지 않습니다.')); return; }
    if (!c.ok) {
      box.appendChild(el('p', 'note', c.why === 'cur'
        ? '이번 기간 분석 문서가 ' + c.N1 + '건뿐이라 비교하지 않습니다(5건 이상 필요).'
        : '직전 기간의 분석 문서가 합쳐서 ' + c.N0 + '건뿐이라 비교하지 않습니다(20건 이상 필요). 수집이 더 쌓이면 비교할 수 있습니다.'));
      return;
    }
    box.appendChild(el('p', 'sum', label + ' 자료 · ' + CUR_NAME[state.pt] + ' 문서 ' + c.N1 + '건 ↔ 평소(' + baseName(c.k) + ', ' + c.base[0] + ' ~ ' + c.base[1] + ') 문서 ' + c.N0 + '건'));
    if (c.mix && c.mix.length) {
      box.appendChild(el('p', 'note alert', '출처 구성이 달라졌습니다: ' + c.mix.map(function (m) { return m.src + ' ' + m.base + '% → ' + m.cur + '%'; }).join(', ') +
        '. 아래 변화에는 출처가 바뀐 영향이 섞여 있어 그대로 읽기 어렵습니다.'));
    }
    var m = 1;
    c.up.concat(c.down).forEach(function (r) { m = Math.max(m, r.p0, r.p1); });
    var max = niceMax(m);
    box.appendChild(legendRow([['b', '평소의 문서 비중'], ['c', CUR_NAME[state.pt] + '의 문서 비중']]));
    box.appendChild(el('h3', null, '평소보다 많이 나온 키워드'));
    box.appendChild(c.up.length ? dumbbell(c.up, c, max) : emptyNote('이번 기간에 2건 이상 나오고 평소보다 비중이 큰 키워드가 없습니다.'));
    box.appendChild(el('h3', null, '평소보다 적게 나온 키워드'));
    box.appendChild(c.down.length ? dumbbell(c.down, c, max) : emptyNote('평소 비중으로 이번 기간에 2건 이상 기대되는데 비중이 작아진 키워드가 없습니다.'));
    var heads = ['키워드', CUR_NAME[state.pt], '평소', '차이', '표준화 점수', '구분'];
    var rowFn = function (r) {
      return [kwCell(r), fraction(r.n1, c.N1, r.p1), fraction(r.n0, c.N0, r.p0), diffCell(r.d), zCell(r.z), isClear(r, r.n1) ? '뚜렷함' : '참고용'];
    };
    box.appendChild(twin(makeTable(heads, c.up.concat(c.down), rowFn)));
    box.appendChild(el('p', 'fine', '같은 사건을 다룬 기사가 여러 곳에 실리면 한 사건이 여러 번 셈되고, 사전 표기 일치 방식의 오추출도 섞여 있습니다.'));
  }

  // 나비 한 줄: 왼쪽 뉴스, 오른쪽 정책. 막대 길이는 문서 비중(%)이며 양쪽이 같은 눈금이다.
  function flyRow(r, g, max) {
    var li = el('li', 'frow');
    var lv = el('span', 'fval l', fmtPct(r.pn)), rv = el('span', 'fval', fmtPct(r.pp));
    var lb = el('span', 'fbar n'), rb = el('span', 'fbar p');
    lb.style.width = (r.pn / max * 100) + '%'; rb.style.width = (r.pp / max * 100) + '%';
    var l = el('span', 'fl'), rr = el('span', 'fr');
    l.appendChild(lb); rr.appendChild(rb);
    var nm = el('span', 'fname', r.kw);
    var tag = r.tag === 'only_news' ? '뉴스에만' : (r.tag === 'only_policy' ? '정책에만' : '');
    if (tag) nm.appendChild(el('span', 'tag', tag));
    if (isBackground(r.id)) nm.appendChild(el('span', 'tag', '상시'));
    li.title = r.kw + ' — 뉴스 ' + r.nn + '/' + g.Nn + '건, 정책 ' + r.np + '/' + g.Np + '건';
    li.appendChild(lv); li.appendChild(l); li.appendChild(nm); li.appendChild(rr); li.appendChild(rv);
    return li;
  }
  function renderGap() {
    var box = $('gapBox'); clear(box);
    var v = M.views[vkey(state.pt, state.period, 'all')], g = v && v.gap;
    box.appendChild(el('p', 'sum', '같은 기간에 뉴스와 정책에서 각 키워드가 나온 문서의 비중을 나란히 봅니다(자료 유형 선택과 관계없이 뉴스와 정책을 모두 비교합니다).'));
    if (!g || !g.ok) {
      var nn = g ? g.Nn : 0, np = g ? g.Np : 0;
      box.appendChild(el('p', 'note', '이 기간에는 뉴스 ' + nn + '건, 정책 ' + np + '건입니다. 두 유형 모두 5건 이상이어야 비교합니다.' +
        (M.commonRange ? ' 두 유형의 자료가 모두 있는 범위는 ' + M.commonRange[0] + ' ~ ' + M.commonRange[1] + '입니다.' : ' 두 유형의 자료가 모두 있는 범위가 아직 없습니다.')));
      return;
    }
    box.appendChild(el('p', 'sum', '뉴스 문서 ' + g.Nn + '건 ↔ 정책 문서 ' + g.Np + '건'));
    var m = 1;
    g.news.concat(g.policy).forEach(function (r) { m = Math.max(m, r.pn, r.pp); });
    var max = niceMax(m);
    box.appendChild(legendRow([['n', '뉴스에서의 문서 비중(왼쪽)'], ['p', '정책에서의 문서 비중(오른쪽)']]));
    [['뉴스에서 더 많이 나온 키워드', g.news], ['정책에서 더 많이 나온 키워드', g.policy]].forEach(function (grp) {
      box.appendChild(el('h3', null, grp[0]));
      if (!grp[1].length) { box.appendChild(emptyNote('해당하는 키워드가 없습니다.')); return; }
      var ul = el('ul', 'fly');
      grp[1].forEach(function (r) { ul.appendChild(flyRow(r, g, max)); });
      box.appendChild(ul);
    });
    var heads = ['키워드', '뉴스', '정책', '차이(뉴스−정책)', '표준화 점수', '비고'];
    box.appendChild(twin(makeTable(heads, g.news.concat(g.policy), function (r) {
      var tag = r.tag === 'only_news' ? '뉴스에만' : (r.tag === 'only_policy' ? '정책에만' : '');
      return [kwCell(r), fraction(r.nn, g.Nn, r.pn), fraction(r.np, g.Np, r.pp), diffCell(r.d), zCell(r.z), tag];
    })));
    box.appendChild(el('p', 'fine', '비중의 차이는 두 자료 유형의 성격(뉴스는 동향 보도, 정책은 부처 발표)과 출처 선정의 영향을 함께 받습니다.'));
  }

  function renderCat() {
    var box = $('catBox'); clear(box);
    var v = M.views[vkey(state.pt, state.period, state.type)], cv = (v && v.catv) || {};
    var cats = (M.categories || []).filter(function (c) { return cv[c]; });
    box.appendChild(el('p', 'sum', '큰 주제(분야) 안에서 어떤 키워드가 나오는지 봅니다. 분야를 고르면 그 분야 키워드가 하나라도 나온 문서들 안에서의 문서 비중을 보여 줍니다.'));
    if (!cats.length) { box.appendChild(emptyNote('이 기간·자료 유형에는 분야가 확인되는 문서가 없습니다.')); return; }
    if (cats.indexOf(state.cat) < 0) state.cat = cats[0];
    var bar = el('div', 'chipbar');
    cats.forEach(function (c) {
      var b = el('button', null, c); b.type = 'button';
      b.appendChild(el('small', null, cv[c].N + '건'));
      b.setAttribute('aria-pressed', String(c === state.cat));
      b.addEventListener('click', function () { state.cat = c; update(); });
      bar.appendChild(b);
    });
    box.appendChild(bar);
    var d = cv[state.cat];
    box.appendChild(el('p', 'sum', '「' + state.cat + '」 분야 키워드가 나온 문서 ' + d.N + '건 안에서의 비중' +
      (d.cmp ? ' · 평소(직전 기간들)의 같은 분야 문서 ' + d.N0 + '건과 비교' : '')));
    if (!d.cmp) {
      box.appendChild(el('p', 'note', '분야 문서가 적어(이번 기간 ' + d.N + '건, 평소 ' + d.N0 + '건; 각각 5건·15건 이상 필요) 평소와 비교하지 않고 비중만 보여 줍니다.'));
      var m1 = 1;
      d.rows.forEach(function (r) { m1 = Math.max(m1, r.p1); });
      var ul = el('ul', 'pairs t-' + state.type);
      d.rows.forEach(function (r) {
        var li = el('li');
        li.appendChild(el('span', 'dname', r.kw));
        var b2 = el('span', 'bar2'); b2.style.width = (r.p1 / m1 * 160) + 'px';
        li.appendChild(b2);
        li.appendChild(el('span', 'n', fmtPct(r.p1) + ' (' + r.n1 + '/' + d.N + '건)'));
        ul.appendChild(li);
      });
      box.appendChild(ul);
      box.appendChild(twin(makeTable(['키워드', '분야 문서 중'], d.rows, function (r) { return [kwCell(r), fraction(r.n1, d.N, r.p1)]; })));
    } else {
      var m = 1;
      d.rows.forEach(function (r) { m = Math.max(m, r.p0, r.p1); });
      var cc = { N1: d.N, N0: d.N0 };
      box.appendChild(legendRow([['b', '평소의 분야 내 비중'], ['c', CUR_NAME[state.pt] + '의 분야 내 비중']]));
      box.appendChild(dumbbell(d.rows, cc, niceMax(m)));
      box.appendChild(twin(makeTable(['키워드', CUR_NAME[state.pt], '평소', '차이', '표준화 점수'], d.rows, function (r) {
        return [kwCell(r), fraction(r.n1, d.N, r.p1), fraction(r.n0, d.N0, r.p0), diffCell(r.d), zCell(r.z)];
      })));
    }
    box.appendChild(el('p', 'fine', '한 문서에 같은 분야 키워드가 여러 개 있으면 각각 셉니다. 분야 분류는 `config/keyword_meta.csv`의 초안입니다.'));
  }
  /* INSIGHT-END */

  function render() {
    if (!state.period) {
      $('status').appendChild(el('p', 'note alert', '기간 집계에 쓸 수 있는 분석 문서가 없습니다. documents.csv의 status, published_date를 확인하세요.'));
      return;
    }
    if (M.notice) { $('notice').textContent = M.notice; $('notice').hidden = false; }
    renderControls(); renderStatus(); renderOverview(); renderRanks(); renderSide(); renderCountry(); renderDocs(); renderChange(); renderGap(); renderCat(); renderTrend();
    $('secGap').hidden = state.type !== 'all';
    $('secTrend').className = 'card ' + (state.pt === 'range' ? '' : 's6');
  }
  function update() { render(); sync(); }

  Object.keys(M.views).forEach(function (k) {
    var v = M.views[k];
    v.map = {};
    v.stats.forEach(function (r) { v.map[r.id] = r; });
  });
  state = readHash();
  $('periodSel').addEventListener('change', function (e) { state.period = e.target.value; state.open = ''; update(); });
  $('topSel').addEventListener('change', function (e) { state.n = parseInt(e.target.value, 10); update(); });
  window.addEventListener('hashchange', function () { state = readHash(); render(); });
  update();
})();
</script>

</body>
</html>
