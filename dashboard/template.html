<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f3f4f0; --panel: #fbfbf8; --ink: #17212b; --muted: #596672; --rule: #d3d8d1;
  --news: #1f4e8c; --policy: #b4690e; --all: #4b5a67; --focus: #1f4e8c;
  --alert: #a3362b; --alert-bg: #f7e4e0; --partial-bg: #efe8d3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12181d; --panel: #182027; --ink: #e7ecef; --muted: #9aa7b2; --rule: #2b3640;
    --news: #7daef0; --policy: #e8a04c; --all: #9fb0bd; --focus: #7daef0;
    --alert: #f0847a; --alert-bg: #3a2320; --partial-bg: #332e1c;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.65 "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  word-break: keep-all; overflow-wrap: break-word;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.masthead { max-width: 1240px; margin: 0 auto; padding: 28px 32px 4px; }
.masthead h1 { margin: 0 0 4px; font-size: 1.55rem; font-weight: 700; letter-spacing: -0.015em; }
.masthead p { margin: 0; max-width: 62ch; color: var(--muted); }
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; max-width: 1240px; margin: 0 auto; padding: 20px 32px 64px; }
.rail { position: sticky; top: 16px; align-self: start; padding-right: 24px; border-right: 1px solid var(--rule); }
.rail fieldset { margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
.rail legend, .rail label { display: block; padding: 0; margin: 0 0 6px; font-size: 0.86rem; font-weight: 600; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.seg button { flex: 1; padding: 7px 4px; background: var(--panel); border: 0; border-right: 1px solid var(--rule); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.rail select { width: 100%; padding: 8px 6px; margin-bottom: 18px; background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; }
.coverage { margin: 0; font-size: 0.84rem; color: var(--muted); }
.covline { display: block; }
.nw { white-space: nowrap; }
main { min-width: 0; }
main h2 { margin: 0 0 6px; font-size: 1.15rem; letter-spacing: -0.01em; }
.sum { margin: 0 0 12px; color: var(--muted); }
.note { margin: 8px 0; padding: 8px 12px; border-left: 4px solid var(--muted); background: var(--panel); font-size: 0.93rem; }
.note.partial { border-left: 4px dashed var(--policy); background: var(--partial-bg); }
.note.alert { border-left-color: var(--alert); background: var(--alert-bg); }
.block { margin-top: 28px; }
.ranks { margin: 12px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.rowbtn { display: grid; grid-template-columns: 3.4rem minmax(7rem, 13rem) minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; padding: 9px 4px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.rowbtn:hover { background: var(--panel); }
.rowbtn[aria-expanded="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--bar, var(--all)); }
.ranks:empty { display: none; }
.rk { font-weight: 700; font-size: 1.05rem; }
.rk .tie { display: block; font-size: 0.72rem; font-weight: 400; color: var(--muted); line-height: 1.1; }
.kw { font-weight: 600; }
.meter { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar { flex: none; height: 20px; min-width: 3px; background: var(--bar, var(--all)); }
.val { font-size: 0.86rem; color: var(--muted); white-space: nowrap; }
.t-news { --bar: var(--news); } .t-policy { --bar: var(--policy); } .t-all { --bar: var(--all); }
.evidence { padding: 8px 4px 16px calc(3.4rem + 16px); border-bottom: 1px solid var(--rule); background: var(--panel); }
.docs { margin: 0; padding: 0; list-style: none; }
.docs li { padding: 5px 0; }
.docs a { color: var(--ink); text-decoration-color: var(--bar, var(--all)); text-underline-offset: 3px; }
.docs .m { margin-left: 12px; font-size: 0.82rem; color: var(--muted); }
.fine { margin: 10px 0 0; font-size: 0.84rem; color: var(--muted); max-width: 70ch; }
.scroll { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; min-width: 100%; font-size: 0.9rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); }
th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--paper); color: var(--ink); font-weight: 600; }
td.cell { background: color-mix(in srgb, var(--bar, var(--all)) calc(var(--i, 0) * 62%), transparent); }
.cur { box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); }
th small { display: block; font-weight: 400; font-size: 0.72rem; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; gap: 12px; padding: 12px 16px 48px; }
  .masthead { padding: 20px 16px 0; }
  .rail { position: static; padding: 0 0 12px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .rowbtn { grid-template-columns: 2.8rem 1fr; }
  .rowbtn .meter { grid-column: 2; }
  .evidence { padding-left: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .bar { transition: width 0.2s ease-out; } }
</style>
</head>
<body>
<header class="masthead">
  <h1>__TITLE__</h1>
  <p>수집한 뉴스·정책 자료에서 기술키워드가 언급된 문서 수를 기간별로 보여 줍니다. 순위는 언급량 기준이며 기술의 중요도나 전망을 뜻하지 않습니다.</p>
</header>
<div class="shell">
  <aside class="rail" aria-label="조회 조건">
    <fieldset><legend>기간 단위</legend><div class="seg" id="ptSeg"></div></fieldset>
    <label for="periodSel">기간</label>
    <select id="periodSel"></select>
    <fieldset><legend>자료 유형</legend><div class="seg" id="typeSeg"></div></fieldset>
    <label for="topSel">표시할 키워드 수</label>
    <select id="topSel"></select>
    <p class="coverage" id="coverage"></p>
  </aside>
  <main id="main">
    <section id="status" aria-live="polite"></section>
    <section class="block" aria-labelledby="rankHead">
      <h2 id="rankHead">키워드 순위</h2>
      <p class="sum" id="rankSum"></p>
      <ol class="ranks" id="rankList"></ol>
      <p class="fine" id="rankMsg"></p>
    </section>
    <section class="block" aria-labelledby="trendHead">
      <h2 id="trendHead">기간별 추이</h2>
      <p class="sum" id="trendSum"></p>
      <div class="scroll"><table id="trend"></table></div>
    </section>
  </main>
</div>
<script type="application/json" id="model">__DATA__</script>
<script>
(function () {
  'use strict';
  var M = JSON.parse(document.getElementById('model').textContent);
  var TYPE_LABEL = {};
  M.types.forEach(function (t) { TYPE_LABEL[t.id] = t.label; });
  var PT = [{ id: 'weekly', label: '주간' }, { id: 'monthly', label: '월간' }];
  var TOPS = [5, 10, 20, 50];
  var state;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function vkey(pt, start, type) { return pt + '|' + start + '|' + type; }
  function isHttp(u) { return /^https?:\/\//i.test(u || ''); }
  function plist(pt) { return M.periods[pt] || []; }
  function plabel(p) { return p.start + ' ~ ' + p.end + (p.partial ? ' (부분 기간)' : ''); }
  function optLabel(p) {
    var end = p.end.slice(0, 4) === p.start.slice(0, 4) ? p.end.slice(5) : p.end;
    return p.start + ' ~ ' + end + (p.partial ? ' (부분)' : '');
  }
  function covLine(label, value) {
    var s = el('span', 'covline');
    s.appendChild(document.createTextNode(label + ' '));
    s.appendChild(el('span', 'nw', value));
    return s;
  }
  function findPeriod(pt, start) {
    var l = plist(pt);
    for (var i = 0; i < l.length; i++) { if (l[i].start === start) return l[i]; }
    return null;
  }
  function sumOver(obj, type) {
    if (type !== 'all') return obj[type] || 0;
    return Object.keys(obj).reduce(function (a, k) { return a + obj[k]; }, 0);
  }

  function readHash() {
    var q = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      try { q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* 잘못된 값은 무시 */ }
    });
    var s = { pt: plist('weekly').length ? 'weekly' : 'monthly', type: 'all', n: 10, open: q.open || '' };
    if (q.pt && plist(q.pt).length) s.pt = q.pt;
    var l = plist(s.pt);
    s.period = l.length ? l[l.length - 1].start : '';
    if (q.p && findPeriod(s.pt, q.p)) s.period = q.p;
    if (q.t && TYPE_LABEL[q.t]) s.type = q.t;
    if (q.n && TOPS.indexOf(parseInt(q.n, 10)) >= 0) s.n = parseInt(q.n, 10);
    return s;
  }
  function sync() {
    var h = '#pt=' + state.pt + '&p=' + state.period + '&t=' + state.type + '&n=' + state.n;
    if (state.open) h += '&open=' + encodeURIComponent(state.open);
    try { history.replaceState(null, '', h); } catch (e) { /* file:// 등에서 막히면 주소 갱신만 생략 */ }
  }

  function renderControls() {
    var ptBox = $('ptSeg'); clear(ptBox);
    PT.forEach(function (o) {
      var b = el('button', null, o.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.pt === o.id));
      b.disabled = !plist(o.id).length;
      b.addEventListener('click', function () {
        var l = plist(o.id);
        state.pt = o.id; state.period = l[l.length - 1].start; state.open = '';
        update();
      });
      ptBox.appendChild(b);
    });
    var sel = $('periodSel'); clear(sel);
    plist(state.pt).slice().reverse().forEach(function (p) {
      var o = el('option', null, optLabel(p));
      o.value = p.start; o.selected = p.start === state.period;
      sel.appendChild(o);
    });
    var tyBox = $('typeSeg'); clear(tyBox);
    M.types.forEach(function (t) {
      var b = el('button', null, t.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.type === t.id));
      b.addEventListener('click', function () { state.type = t.id; state.open = ''; update(); });
      tyBox.appendChild(b);
    });
    var top = $('topSel'); clear(top);
    TOPS.forEach(function (n) {
      var o = el('option', null, '상위 ' + n + '개');
      o.value = n; o.selected = n === state.n;
      top.appendChild(o);
    });
    var cov = $('coverage'); clear(cov);
    if (M.latestCollected) {
      cov.appendChild(covLine('수집 종료일', M.latestCollected));
      cov.appendChild(covLine('화면 생성', M.generatedAt.replace('T', ' ').slice(0, 16)));
    } else {
      cov.textContent = '수집일 정보가 없어 부분 기간을 판정하지 못했습니다.';
    }
  }

  function renderStatus() {
    var box = $('status'); clear(box);
    var p = findPeriod(state.pt, state.period), v = M.views[vkey(state.pt, state.period, state.type)];
    var label = TYPE_LABEL[state.type];
    box.appendChild(el('h2', null, p.start + ' ~ ' + p.end));
    box.appendChild(el('p', 'sum', label + ' 자료에서 분석한 문서는 ' + v.analyzed + '건이고, 이 기간에 제외한 문서는 ' + v.excluded + '건입니다.'));
    if (p.partial) {
      box.appendChild(el('p', 'note partial', '부분 기간입니다. 이 기간은 수집 종료일(' + M.latestCollected + ')보다 뒤까지 이어지므로 이후 수집분이 들어오면 수치가 바뀝니다.'));
    }
    if (v.csvTotal !== null && v.csvTotal !== v.analyzed) {
      box.appendChild(el('p', 'note alert', 'keyword_stats.csv의 total_documents(' + v.csvTotal + ')와 documents.csv에서 센 분석 문서 수(' + v.analyzed + ')가 다릅니다. 두 파일을 같은 실행 결과로 다시 만드세요.'));
    }
    var failed = sumOver(M.overall.failed, state.type);
    if (failed > 0) {
      box.appendChild(el('p', 'note alert', '전체 기간에서 수집 또는 분석에 실패한 ' + label + ' 문서 ' + failed + '건은 어느 기간 집계에도 포함되지 않았습니다.'));
    }
    var undated = sumOver(M.overall.excludedUndated, state.type);
    if (undated > 0) {
      box.appendChild(el('p', 'note', '전체 기간에서 발행일을 확인할 수 없어 제외한 ' + label + ' 문서 ' + undated + '건은 어느 기간 집계에도 들어가지 않았습니다.'));
    }
  }

  function fillEvidence(panel, v, kid) {
    clear(panel);
    var idxs = (v.ev && v.ev[kid]) || [];
    if (!idxs.length) {
      panel.appendChild(el('p', 'fine', '근거 문서를 찾지 못했습니다. documents.csv와 document_keywords.csv가 같은 실행 결과인지 확인하세요.'));
      return;
    }
    var ul = el('ul', 'docs');
    idxs.forEach(function (i) {
      var d = M.docs[i], li = el('li'), t;
      if (isHttp(d.u)) {
        t = el('a', null, d.t);
        t.href = d.u; t.target = '_blank'; t.rel = 'noopener noreferrer';
      } else {
        t = el('span', null, d.t);
      }
      li.appendChild(t);
      li.appendChild(el('span', 'm', d.d));
      li.appendChild(el('span', 'm', d.s));
      li.appendChild(el('span', 'm', TYPE_LABEL[d.y] || d.y));
      ul.appendChild(li);
    });
    panel.appendChild(ul);
  }

  function renderRanks() {
    var v = M.views[vkey(state.pt, state.period, state.type)];
    var list = $('rankList'), sum = $('rankSum'), msg = $('rankMsg');
    clear(list); sum.textContent = ''; msg.textContent = '';
    var label = TYPE_LABEL[state.type];
    if (v.analyzed === 0) {
      sum.textContent = '이 기간에는 분석한 ' + label + ' 문서가 없습니다. 비율과 순위는 ‘해당 없음’입니다.';
      msg.textContent = '다른 기간을 고르거나 수집 범위를 확인하세요.';
      return;
    }
    if (!v.stats.length) {
      sum.textContent = '분석한 문서 ' + v.analyzed + '건에서 사전에 등록된 기술키워드가 검출되지 않았습니다.';
      msg.textContent = '키워드 사전(config/keywords.csv)의 범위를 확인하세요.';
      return;
    }
    var rows = v.stats, shown = rows.slice(0, state.n);
    if (state.open && !shown.some(function (r) { return r.id === state.open; })) state.open = '';
    var max = Math.max.apply(null, rows.map(function (r) { return r.dc; }));
    var count = {};
    rows.forEach(function (r) { count[r.rank] = (count[r.rank] || 0) + 1; });
    sum.textContent = '검출된 키워드 ' + rows.length + '개 중 상위 ' + shown.length + '개를 보여 줍니다. 키워드를 누르면 근거 문서가 열립니다.';
    shown.forEach(function (row) {
      var li = el('li');
      var b = el('button', 'rowbtn t-' + state.type);
      b.type = 'button';
      var isOpen = state.open === row.id;
      b.setAttribute('aria-expanded', String(isOpen));
      var rk = el('span', 'rk', row.rank);
      if (count[row.rank] > 1) rk.appendChild(el('span', 'tie', '공동'));
      var meter = el('span', 'meter');
      var bar = el('span', 'bar');
      bar.style.width = (row.dc / max * 60) + '%';
      meter.appendChild(bar);
      meter.appendChild(el('span', 'val', '문서 ' + row.dc + '건, 출현 ' + row.oc + '회, 비율 ' + row.share + '%'));
      b.appendChild(rk); b.appendChild(el('span', 'kw', row.kw)); b.appendChild(meter);
      var panel = el('div', 'evidence t-' + state.type);
      panel.id = 'ev-' + row.id;
      panel.hidden = !isOpen;
      b.setAttribute('aria-controls', panel.id);
      if (isOpen) fillEvidence(panel, v, row.id);
      b.addEventListener('click', function () {
        var willOpen = panel.hidden;
        Array.prototype.forEach.call(list.querySelectorAll('.evidence'), function (p) { p.hidden = true; });
        Array.prototype.forEach.call(list.querySelectorAll('.rowbtn'), function (x) { x.setAttribute('aria-expanded', 'false'); });
        if (willOpen) { fillEvidence(panel, v, row.id); panel.hidden = false; b.setAttribute('aria-expanded', 'true'); }
        state.open = willOpen ? row.id : '';
        sync();
      });
      li.appendChild(b); li.appendChild(panel);
      list.appendChild(li);
    });
    var note = '순위는 문서 빈도 기준이며 같은 값이면 공동 순위입니다. 같은 순위 안에서는 키워드 이름순으로 나열합니다. 막대 길이는 이 화면에서 가장 높은 문서 빈도를 기준으로 합니다.';
    if (rows.length > shown.length && rows[shown.length].rank === shown[shown.length - 1].rank) {
      note += ' 표시 개수 때문에 마지막 순위와 같은 순위의 키워드가 목록 밖에 더 있습니다.';
    }
    msg.textContent = note;
  }

  function renderTrend() {
    var table = $('trend'), sum = $('trendSum');
    clear(table);
    var v = M.views[vkey(state.pt, state.period, state.type)];
    if (!v.stats.length) { sum.textContent = '표시할 키워드가 없어 추이를 그리지 않습니다.'; return; }
    var kws = v.stats.slice(0, state.n), periods = plist(state.pt);
    sum.textContent = '현재 기간의 상위 ' + kws.length + '개 키워드가 각 기간에 몇 개 문서에서 언급됐는지 보여 줍니다. 굵은 테두리는 선택한 기간입니다. ‘–’는 그 기간에 분석한 문서가 없다는 뜻입니다.';
    table.className = 't-' + state.type;
    var cells = {}, max = 1;
    periods.forEach(function (p) {
      var pv = M.views[vkey(state.pt, p.start, state.type)];
      kws.forEach(function (k) {
        var r = pv && pv.analyzed > 0 ? (pv.map[k.id] || { dc: 0 }) : null;
        cells[p.start + '|' + k.id] = r;
        if (r && r.dc > max) max = r.dc;
      });
    });
    var head = el('tr');
    head.appendChild(el('th', null, '키워드'));
    periods.forEach(function (p) {
      var th = el('th', p.start === state.period ? 'cur' : null, state.pt === 'monthly' ? p.start.slice(0, 7) : p.start.slice(5));
      th.title = plabel(p);
      if (state.pt === 'weekly') th.appendChild(el('small', null, '~' + p.end.slice(5)));
      if (p.partial) th.appendChild(el('small', null, '부분'));
      head.appendChild(th);
    });
    var thead = el('thead'); thead.appendChild(head); table.appendChild(thead);
    var tbody = el('tbody');
    kws.forEach(function (k) {
      var tr = el('tr');
      tr.appendChild(el('td', null, k.kw));
      periods.forEach(function (p) {
        var r = cells[p.start + '|' + k.id], pv = M.views[vkey(state.pt, p.start, state.type)];
        var td = el('td', 'cell' + (p.start === state.period ? ' cur' : ''), r ? String(r.dc) : '–');
        if (r) {
          td.style.setProperty('--i', r.dc / max);
          td.title = '문서 ' + r.dc + '건 (분석 ' + pv.analyzed + '건 중)';
        } else {
          td.title = '분석한 문서가 없는 기간';
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
  }

  function render() {
    if (!state.period) {
      $('status').appendChild(el('p', 'note alert', '기간 집계에 쓸 수 있는 분석 문서가 없습니다. documents.csv의 status, published_date를 확인하세요.'));
      return;
    }
    renderControls(); renderStatus(); renderRanks(); renderTrend();
  }
  function update() { render(); sync(); }

  Object.keys(M.views).forEach(function (k) {
    var v = M.views[k];
    v.map = {};
    v.stats.forEach(function (r) { v.map[r.id] = r; });
  });
  state = readHash();
  $('periodSel').addEventListener('change', function (e) { state.period = e.target.value; state.open = ''; update(); });
  $('topSel').addEventListener('change', function (e) { state.n = parseInt(e.target.value, 10); update(); });
  window.addEventListener('hashchange', function () { state = readHash(); render(); });
  update();
})();
</script>

</body>
</html>
